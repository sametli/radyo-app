name: APK Derleyici
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Proje Iskeletini Kur ve Bildirim Servisini Enjekte Et
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.sametli --project-name radyo_app .
          cp -r android ../
          cd ..
          rm -rf temp_app
          
          # 1. Internet, Foreground Service ve WakeLock izinlerini ekle
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.WAKE_LOCK"/>\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>' android/app/src/main/AndroidManifest.xml
          
          # 2. HTTP radyo yayinlari icin Cleartext iznini ekle
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          # 3. Bildirim cubugu icin AudioServiceActivity ve servisini ekle
          sed -i 's/android:name=".MainActivity"/android:name="com.ryanheise.just_audio_background.AudioServiceActivity"/' android/app/src/main/AndroidManifest.xml
          sed -i '/<\/activity>/a \
          <service android:name="com.ryanheise.just_audio_background.AudioService"\n            android:foregroundServiceType="mediaPlayback"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.media.browse.MediaBrowserService" />\n            </intent-filter>\n          </service>\n          <receiver android:name="androidx.media.session.MediaButtonReceiver"\n            android:exported="true">\n            <intent-filter>\n                <action android:name="android.intent.action.MEDIA_BUTTON" />\n            </intent-filter>\n          </receiver>' android/app/src/main/AndroidManifest.xml

      - name: Paketleri Cek
        run: flutter pub get

      - name: APK Derle
        run: flutter build apk --release

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Reklamsiz-Radyo-APK
          path: build/app/outputs/flutter-apk/app-release.apk
