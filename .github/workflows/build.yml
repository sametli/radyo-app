name: APK Derleyici
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java Kurulumu
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Flutter Kurulumu
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Eksiksiz Proje Iskeleti Olustur
        run: |
          mkdir temp_app
          cd temp_app
          flutter create --org com.sametli --project-name radyo_app .
          cp -r android ../
          cd ..
          rm -rf temp_app

      - name: Paketleri Cek
        run: flutter pub get

      - name: APK Derle
        run: flutter build apk --release

      - name: APK Dosyasini Yukle
        uses: actions/upload-artifact@v4
        with:
          name: Reklamsiz-Radyo-APK
          path: build/app/outputs/flutter-apk/app-release.apk
